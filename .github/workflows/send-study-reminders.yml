name: Send scheduled study reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: send-study-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$REMINDER_CRON_SECRET" ]; then
            echo "Study reminders are not configured; set the SUPABASE_URL and REMINDER_CRON_SECRET Actions secrets to enable them."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $REMINDER_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/functions/v1/send-study-reminders"
